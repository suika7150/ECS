# 應用程式名稱
spring.application.name=ecs-shop-backend

# 資料庫驅動 (所有環境都用 MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 基礎設定
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger 預設路徑
springdoc.swagger-ui.path=/swagger-ui.html

# 伺服器基礎設定
server.address=0.0.0.0

# 預設啟動的 Profile
spring.profiles.active=sit

# 處理檔案上傳大小限制
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 設定 JSON 回傳的時間格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

jwt.secret=8c9b55dd8bca22cd53a71d9bb5f607da
# 一般登入設為 24 小時 86400000
jwt.normal-expiration=86400000
# 保持登入設為 7 天 604800000
jwt.remember-me-expiration=604800000

# jwt.secret=${JWT_SECRET}

# 日誌路徑
# logging.file.name=logs/ecs.log

# GZIP 網頁壓縮設定 (優化電商商品 JSON 與 Swagger 載入速度)
# HTTP 回應壓縮功能
server.compression.enabled=true

# 設定觸發壓縮的最小檔案大小（單位：Bytes），這裡設定 2048 Bytes = 2KB
# 小於 2KB 的資料不需要壓，因為壓縮反而會浪費 CPU 運算
server.compression.min-response-size=2048

# 指定資料格式需要進行 GZIP 壓縮
# 核心的就是 application.json (商品資料) 與 text/css, text/javascript (Swagger/前端網頁)
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
