# 資料庫連線設定
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 根據 Entity 自動更新資料庫結構
spring.jpa.hibernate.ddl-auto=update

# 顯示產生的 SQL 
spring.jpa.show-sql=false

# 服務埠號
server.port=8080

# 伺服器基礎設定
server.address=0.0.0.0

# 開啟Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Mail (JavaMailSender)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google reCAPTCHA 設定
google.recaptcha.site-key=${RECAPTCHA_SITE_KEY}
google.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}

# 綠界測試環境金鑰
ecpay.merchant-id=2000132
ecpay.hash-key=5294y06JbISpM5x9
ecpay.hash-iv=v77hoKGq4kWxNNIS

# 綠界通知後端的網址 (ngrok 網址)
ecpay.return-url=https://palladous-upmost-margaretta.ngrok-free.dev/api/payment/callback
# 使用者付款完要跳轉回前端的網址
ecpay.client-back-url=http://192.168.1.152:5173/checkout/success

jwt.secret=${JWT_SECRET}

# 一般登入設為 24 小時 86400000
jwt.normal-expiration=86400000
# 保持登入設為 7 天 604800000
jwt.remember-me-expiration=604800000

# 讓 Log 顯示 SQL 的參數內容
logging.file.name=logs/ecs.log
logging.level.com.shop.ecs=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
